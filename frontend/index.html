<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Mezat — Giriş</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo-icon { font-size: 48px; display: block; }
    .logo h1 { font-size: 24px; font-weight: 800; color: #fff; margin-top: 10px; }
    .logo p { font-size: 14px; color: #666; margin-top: 4px; }
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background: #1f1f1f;
      border: 1px solid #333;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: #4f87ff; }
    .error {
      background: #2d1515;
      border: 1px solid #6b2020;
      color: #ff9090;
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
    }
    button {
      width: 100%;
      padding: 13px;
      background: #4f87ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 4px;
    }
    button:hover { background: #3a72f0; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <span class="logo-icon">🎯</span>
      <h1>Canlı Mezat</h1>
      <p>Sohbet Paneli</p>
    </div>
    <form id="login-form">
      <div class="input-group">
        <label>Kullanıcı Adı</label>
        <input type="text" id="username" placeholder="kullanıcı adınız" required autocomplete="username">
      </div>
      <div class="input-group">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <div class="error" id="error-msg"></div>
      <button type="submit" id="login-btn">Giriş Yap</button>
    </form>
  </div>

  <script>
    const BACKEND = window.location.origin;

    // Zaten giriş yapılmışsa chat'e yönlendir
    const token = localStorage.getItem('cm_token');
    if (token) {
      fetch(BACKEND + '/api/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token })
      }).then(r => r.json()).then(data => {
        if (data.valid) window.location.href = '/chat.html';
      });
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');
      err.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Giriş yapılıyor...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(BACKEND + '/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          err.textContent = data.error || 'Giriş başarısız';
          err.style.display = 'block';
        } else {
          localStorage.setItem('cm_token', data.token);
          localStorage.setItem('cm_username', data.username);
          window.location.href = '/chat.html';
        }
      } catch {
        err.textContent = 'Sunucuya bağlanılamadı.';
        err.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = 'Giriş Yap';
    });
  </script>
</body>
</html>
